name: Build and Release

on:
  push:
    branches:
      - "Fabric/26.2"
    paths:
      - "src/**"
      - "*.gradle"
      - "gradle.properties"
      - "CHANGELOG.md"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Read Version
        id: mod_props
        run: |
          VERSION=$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2 | tr -d " ")
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}+26.2-fabric-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Collect jars
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls dist

      - name: Create Tag
        run: |
          git tag v${{ steps.mod_props.outputs.release_version }}
          git push origin v${{ steps.mod_props.outputs.release_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.mod_props.outputs.release_version }}
          name: OptimizerSodiumAddon ${{ steps.mod_props.outputs.release_version }}
          generate_release_notes: true
          files: |
            dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        if: ${{ contains(github.event.head_commit.message, '[curseforge') }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MOD_VERSION: ${{ steps.mod_props.outputs.mod_version }}
        run: |
          set -euo pipefail
          : "${CURSEFORGE_TOKEN:?Add the CURSEFORGE_TOKEN secret to the repository}"
          : "${CURSEFORGE_PROJECT_ID:?Add the CURSEFORGE_PROJECT_ID variable to the repository}"
          MC="26.2"
          LOADER="fabric"
          LOADER_NAME="Fabric"
          JAVA_TAG="Java 25"

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[curseforge\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi

          CHANGELOG=$(awk -v v="$MOD_VERSION" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1 && $0 !~ /\(Español\)/) found=1 } found' CHANGELOG.md)
          [ -n "$CHANGELOG" ] || CHANGELOG="Optimizer Sodium Addon $MOD_VERSION for $LOADER_NAME $MC."

          tag="curseforge-$LOADER-$MC-$MOD_VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$LOADER_NAME $MC $MOD_VERSION is already on CurseForge (tag $tag), not uploading it again"
            exit 0
          fi

          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          name=$(basename "$jar" .jar)
          relations='[{"slug":"fabric-api","type":"requiredDependency"},{"slug":"sodium","type":"optionalDependency"}]'

          KNOWN_VERSIONS=$(curl -sS --fail-with-body -H "X-Api-Token: $CURSEFORGE_TOKEN" "https://minecraft.curseforge.com/api/game/versions")
          GAME_VERSIONS=$(jq -nc \
            --arg mc "$MC" --arg loader "$LOADER_NAME" --arg java "$JAVA_TAG" \
            --argjson known "$KNOWN_VERSIONS" \
            '[$mc, $loader, "Client", "Server", $java] | map(select(. as $n | any($known[]; .name == $n)))')
          echo "Game versions sent to CurseForge: $GAME_VERSIONS"
          if [ "$(jq 'length' <<< "$GAME_VERSIONS")" -ne 5 ]; then
            echo "::warning::CurseForge does not list every game version for this file (expected $MC, $LOADER_NAME, Client, Server, $JAVA_TAG)"
          fi

          metadata=$(jq -nc \
            --arg changelog "$CHANGELOG" \
            --arg type "$RELEASE_TYPE" \
            --arg name "$name" \
            --argjson versions "$GAME_VERSIONS" \
            --argjson relations "$relations" \
            '{changelog: $changelog, changelogType: "markdown", releaseType: $type, displayName: $name,
              gameVersionNames: $versions,
              relations: {projects: $relations}}')

          echo "Uploading $jar to CurseForge as a $RELEASE_TYPE for $LOADER_NAME $MC"
          curl -sS --fail-with-body -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form-string "metadata=$metadata" -F "file=@$jar"
          echo
          git tag "$tag"
          git push origin "$tag"

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

version = minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_named
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {}
    server {
        argument '--nogui'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.caffeinemc.net/releases' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version  : minecraft_version,
            neoforge_version   : neoforge_version,
            loader_version     : loader_version,
            mod_id             : mod_id,
            mod_name           : mod_name,
            mod_named         : mod_named,
            mod_version        : mod_version,
            mod_author         : mod_author,
            mod_description         : mod_description,
            mod_license             : mod_license,
            mod_issue_tracker       : mod_issue_tracker
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : project.version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author
        ])
    }
}
